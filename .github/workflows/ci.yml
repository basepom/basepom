---
name: CI Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true
          fetch-depth: 0

      - uses: actions/setup-java@v6
        id: build_jdk
        with:
          java-version: 25
          distribution: temurin
          cache: maven

      - name: build distribution
        env:
          MAVEN_ARGS: "-B -fae"
        run: |
          make install

  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true
          fetch-depth: 0

      - uses: actions/setup-java@v6
        id: build_jdk
        with:
          java-version: 25
          distribution: temurin
          cache: maven

      - name: build distribution
        env:
          MAVEN_ARGS: "-B -fae"
        run: |
          make docs
