---
name: CD (Snapshot deployment)

on:
  push:
    branches:
      - main

jobs:
  cd:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin
          cache: maven
          server-id: sonatype-central-portal
          server-username-env-var: CENTRAL_REPO_USER
          server-password-env-var: CENTRAL_REPO_PASSWORD

      - name: deploy code
        env:
          CENTRAL_REPO_USER: ${{ secrets.CENTRAL_REPO_USER }}
          CENTRAL_REPO_PASSWORD: ${{ secrets.CENTRAL_REPO_PASSWORD }}
          MAVEN_ARGS: "-B -ff"
        run: |
          make deploy

  site:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: configure git user
        run: |
          git config --global user.name github-cd-action
          git config --global user.email github-cd-action@basepom.org

      - uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin
          cache: maven
          server-id: github
          server-password: SITE_DEPLOY

      - name: publish docs
        env:
          SITE_DEPLOY: ${{ secrets.SITE_DEPLOY_TOKEN  }}
          MAVEN_ARGS: "-B -ff"
        run: |
          make deploy-site
